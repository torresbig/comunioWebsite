<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚽ Comunio Ultraz - Transfermarkt (Comunio)</title>
    <link rel="stylesheet" href="css/debugPanel.css">
    <link rel="stylesheet" href="css/styleMenueHamburger.css">
    <link rel="stylesheet" href="css/transfermarktComunio.css">
    <link rel="stylesheet" href="css/siteHeader.css?v=20260832">
    <link rel="stylesheet" href="css/pageBackground.css">
    <link rel="stylesheet" href="css/filterDesign.css">
    <link rel="stylesheet" href="css/modernTheme.css">
</head>

<body class="page-transfermarkt">
    <!-- Floating Debug Button and Panel -->
    <button id="floatingDebugBtn" title="Debug"><span style="pointer-events:none;">🐞</span></button>
    <div id="floatingDebugPanel">
        <div id="floatingDebugPanelHeader">
            Debug-Informationen
            <button id="floatingDebugPanelClose" title="Schließen">×</button>
        </div>
        <div id="floatingDebugContent"></div>
    </div>


    <!-- Hamburger-Menü -->
    <div class="hamburger-menu">
        <button class="hamburger-button" id="hamburgerButton">
            <div class="hamburger-line"></div>
            <div class="hamburger-line"></div>
            <div class="hamburger-line"></div>
        </button>
        <div class="hamburger-dropdown" id="hamburgerDropdown">
            <!-- Menü wird durch js/hamburgerMenu.js aus js/config.js (HAMBURGER_MENU_CONFIG) dynamisch generiert -->
        </div>

    </div>

    <!-- ===== NAVBAR HEADER ===== -->
    <div class="site-header">
        <div class="site-header-inner">
            <div class="site-header-center">
                <h1 class="site-header-title">Transfermarkt (Comunio)</h1>
            </div>
        </div>
    </div>

    <main>

        <!-- Loading indicator -->
        <div id="loading" class="loading">Lade Daten...</div>

        <!-- Error message -->
        <div id="error" style="display:none;" class="error">
            <span id="errorMessage"></span>
        </div>

        <!-- Content -->
        <div id="content" style="display:none;">
                        <div id="filterMenuContainer" class="filter-section">
    <button id="toggleFilterMenuBtn" type="button">Filter</button>
    <form id="filterForm">
        <div>
      <label>
        <input type="checkbox" id="filterComputerOwner" /> Nur Computer-Angebote
      </label>
      <label>
        <input type="checkbox" id="filterPrice160000" /> Preis = 160.000&nbsp;€
      </label>
      <label>
        <input type="checkbox" id="filterNotStatusAktiv" /> Status ungleich "aktiv"
      </label>
      <label>
        <input type="checkbox" id="filterPriceBelowValue" /> Preis < Marktwert
      </label>
    </div>
        <button type="button" id="resetFilterBtn">Filter zurücksetzen</button>
  </form>
        </div>
            <div class="table-container">
                <table id="transferTable">
                    <thead>
                        <tr>
                            <th data-sort="string">Club</th>
                            <th data-sort="string">Spieler</th>
                            <th data-sort="string">Status</th>
                            <th data-sort="string">Pos.</th>
                            <th data-sort="number">Punkte</th>
                            <th data-sort="number">Preis (Wert)</th>
                            <th data-sort="string">Owner</th>
                            <th data-sort="remaining">Restzeit</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/ownerMap.js"></script>
    <script src="js/debugPanel.js"></script>
    <script src="js/hamburgerMenu.js"></script>
    <script src="js/transfermarktComunio.js"></script>
    <script src="js/transfermarktComunioFilter.js"></script>
</body>


</html>
