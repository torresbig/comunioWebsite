<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comunio Ultraz - User Statistiken</title>
    <link rel="stylesheet" href="css/debugPanel.css">
    <link rel="stylesheet" href="css/playerTable.css">
    <link rel="stylesheet" href="css/styleMenueHamburger.css">
    <link rel="stylesheet" href="css/statistics.css">
    <link rel="stylesheet" href="css/siteHeader.css?v=20260832">
    <link rel="stylesheet" href="css/pageBackground.css">
    <link rel="stylesheet" href="css/modernTheme.css">
    <style>

    </style>
</head>

<body class="page-statistik">
    <!-- Debug Button -->
    <button id="floatingDebugBtn" title="Debug">🐞</button>
    <div id="floatingDebugPanel">
        <div id="floatingDebugPanelHeader">
            Debug-Informationen
            <button id="floatingDebugPanelClose" title="Schließen">×</button>
        </div>
        <div id="floatingDebugContent"></div>
    </div>
 <!-- Hamburger-Menü -->
    <div class="hamburger-menu">
        <button class="hamburger-button" id="hamburgerButton">
            <div class="hamburger-line"></div>
            <div class="hamburger-line"></div>
            <div class="hamburger-line"></div>
        </button>
        <div class="hamburger-dropdown" id="hamburgerDropdown">
            <!-- Menü wird durch js/hamburgerMenu.js aus js/config.js (HAMBURGER_MENU_CONFIG) dynamisch generiert -->
        </div>

    </div>

    <div class="site-header">
            <div class="site-header-inner">
                <div class="site-header-center">
                <h1 class="site-header-title">User Statistiken</h1>
                </div>
            </div>
        </div>
    <div class="container">

        <!-- Statistik-Karten -->
        <div class="stats-grid">
            <!-- Diese werden dynamisch befüllt -->
        </div>

        <!-- Haupttabelle (conditional: nur anzeigen wenn showStats=1) -->
                <h2 class="conditional-content">User Übersicht</h2>
                <div class="user-table-container conditional-content">
            <table class="user-table" id="userTable">
                <thead>
                    <tr>
                        <th>User (ID)</th>
                        <th>Kontostand (€)</th>
                        <th>Teamwert (€)</th>
                        <th>Gesamtwert (€)</th>
                        <th>Transfers</th>
                        <th>Punkte</th>
                        <th>Punkte Einnahmen (€)</th>
                        <th>Transferausgaben (€)</th>
                        <th>Transfereinnahmen (€)</th>
                        <th>Gesamtbewegung (€)</th>
                    </tr>
                </thead>
                <tbody id="userTableBody">
                    <!-- Wird dynamisch befüllt -->
                </tbody>
            </table>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/debugPanel.js"></script>
    <script src="js/hamburgerMenu.js"></script>
    <script src="js/statistics.js"></script>
    <script>

    </script>
